# Only the github-actions ecosystem, because it is the only ecosystem this repository has. Action pins
# rot silently: a pin whose `# vX.Y.Z` comment no longer matches its SHA cannot be checked by reading
# the diff, and there are now two actions pinned here across two workflows. Dependabot moves the SHA
# and the comment together, which is exactly the class of mistake that broke this fleet's first
# contracts run.
#
# A language ecosystem is deliberately absent rather than merely not needed yet. The first code that
# lands here arrives with its own gate (`ci.yml`) and its own lockfile policy, and that commit is the
# right place to decide whether a monthly dependency pull request is signal or noise — not this file,
# written before there is anything to update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]          # one pull request, not one per action
    commit-message:
      prefix: chore
    # Seven days between an action's release and the pull request that proposes it. A SHA pin defends
    # against a tag being moved under us; it does nothing about a release that is malicious on the day
    # it is published, because Dependabot would then hand us the attacker's commit with a version
    # comment that looks correct. A week is the window in which such a release is normally withdrawn.
    # zizmor reports the absence of one as `dependabot-cooldown`.
    cooldown:
      default-days: 7
