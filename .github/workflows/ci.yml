name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly on main, so a date-dependent test or a runner change is caught without a push.
  schedule:
    - cron: "28 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_CATALOG_TEST_DATABASE_URL: postgres://github:github@127.0.0.1:5432/github
      GITHUB_TEST_NATS_URL: nats://127.0.0.1:4225
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: github
          POSTGRES_PASSWORD: github
          POSTGRES_DB: github
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U github -d github"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The bus tests need a JetStream broker, and the authorization test starts its own from
      # deploy/nats/identity.conf, so the binary is installed from a pinned, checksummed release.
      - name: Install nats-server
        env:
          NATS_VERSION: v2.15.0
          NATS_SHA256: 5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92
        run: |
          set -euo pipefail
          archive="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/${archive}"
          echo "${NATS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" --strip-components=1 "nats-server-${NATS_VERSION}-linux-amd64/nats-server"
          sudo install -m 0755 "${RUNNER_TEMP}/nats-server" /usr/local/bin/nats-server
      - name: Start the JetStream test broker
        run: |
          set -euo pipefail
          nohup nats-server -js -a 127.0.0.1 -p 4225 --store_dir "${RUNNER_TEMP}/nats-store" > "${RUNNER_TEMP}/nats.log" 2>&1 &
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/4225) 2>/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat "${RUNNER_TEMP}/nats.log"
          exit 1
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --doc
      - run: cargo build --workspace --locked --release
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust - the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' DEVELOPMENT.md)
          test "$in_ci" = "$in_doc"

  # Separate from the gate so a new RustSec advisory cannot hide a clippy or test failure behind it.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
