services:
  postgres:
    image: postgres:17
    container_name: ratatoskr-github-postgres
    environment:
      POSTGRES_USER: github
      POSTGRES_PASSWORD: github
      POSTGRES_DB: github
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github -d github && psql -U github -d github -c 'select 1' > /dev/null"]
      interval: 1s
      timeout: 5s
      retries: 30
  nats:
    image: nats:2-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    container_name: ratatoskr-github-nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:14227:4222"
      - "127.0.0.1:18227:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 1s
      timeout: 5s
      retries: 30
