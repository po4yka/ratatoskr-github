# The GITHUB stanza of the reviewed NATS ACL, `ratatoskr-platform/deploy/nats/ratatoskr.conf`
# (XR-021 CONTRACTS.md S03). Platform's file is the only deployed ACL; this is a byte-equal copy of
# this service's own stanza (comments, whitespace and the nkey token ignored) so the
# authorization-enabled broker test in `services/catalog/tests/authorized_bus.rs` proves exactly
# what is deployed. The workspace equality check fails when the two diverge.
#
# Seed file: `/etc/ratatoskr/github.nkey`, read at runtime through
# `RATATOSKR__BUS__NKEY_SEED_PATH`. The nkey below is a placeholder for the public key printed by
# `ratatoskr-platform/deploy/nats/README.md`'s generation step; it is not a secret and it
# authenticates nobody who does not hold the seed.
#
# A denied publish is invisible to the client: the broker logs a `Publish Violation` and the
# publish simply never receives its acknowledgement. When a relay publish times out, read the NATS
# server log before debugging this service.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_GITHUB_XXXXXXXX
    permissions: {
        publish: {
            allow: [
                # The two facts this service originates: the analysis request for Knowledge and
                # the whole-catalog policy command for Vault.
                "evt.knowledge.repository_analysis.requested.v1",
                "cmd.vault.backup_policy.apply_requested.v1",
                # Its three Edge-provisioned durables, and only their inspect, fetch and ack
                # subjects. It cannot create a consumer or read any other durable.
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_github_analysis_completed",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_github_analysis_completed",
                "$JS.ACK.ratatoskr_events.ratatoskr_github_analysis_completed.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_github_analysis_failed",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_github_analysis_failed",
                "$JS.ACK.ratatoskr_events.ratatoskr_github_analysis_failed.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_github_policy_acknowledged",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_github_policy_acknowledged",
                "$JS.ACK.ratatoskr_events.ratatoskr_github_policy_acknowledged.>",
            ]
        }
        subscribe: { allow: ["_INBOX.>"] }
    }
}
